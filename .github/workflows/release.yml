name: Release

# Builds, packages, verifies, attests, and publishes one app's release. The app's own
# release.yml runs ci.yml on the same commit first, then calls this.
#
# The archives are a contract with every installed copy of the app, because app-update
# installs from them: <bin>-<version>-<platform>.zip (.tar.gz on Linux) holding
# <bin>-<version>-<platform>/<bin>[.exe] with README.md and LICENSE, beside a SHA256SUMS that
# lists every archive. Renaming any part strands users on the version before the rename.
on:
  workflow_call:
    inputs:
      package:
        description: The Cargo package whose version is released and whose binary is built
        required: true
        type: string
      bin:
        description: The executable name without .exe, which also prefixes each archive
        required: true
        type: string
      release-tag:
        description: >-
          For a manual run, an existing v* tag to rebuild and publish. Empty is a dry run that
          publishes nothing. A tag push ignores this and releases the pushed tag.
        required: false
        type: string
        default: ""
      linux:
        description: Also build and ship a linux-x86_64 archive, in the pinned Ubuntu 22.04 container
        required: false
        type: boolean
        default: false
      linux-floor-check:
        description: Path, in the app, to a script run on the Linux binary to check its glibc floor
        required: false
        type: string
        default: ""
      submodules:
        description: Passed to actions/checkout, such as "recursive"
        required: false
        type: string
        default: "false"

permissions: {}

env:
  CARGO_TERM_COLOR: always
  APP_PACKAGE: ${{ inputs.package }}
  BIN: ${{ inputs.bin }}
  PLATFORMS: ${{ inputs.linux && 'windows-x86_64 linux-x86_64' || 'windows-x86_64' }}

defaults:
  run:
    shell: bash

jobs:
  meta:
    name: Resolve version
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      ref: ${{ steps.version.outputs.ref }}
    env:
      # Only a pushed tag or a tag named in a manual run releases. A manual run started from a
      # tag without naming one is still a dry run.
      TAG: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || inputs.release-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release-tag && format('refs/tags/{0}', inputs.release-tag) || github.ref }}
      - &install-rust
        name: Install the pinned Rust toolchain
        run: |
          echo "ImageOS=${ImageOS:-unknown} ImageVersion=${ImageVersion:-unknown}"
          rustup toolchain install
          rustc --version
          cargo --version
      # Every later job builds the commit resolved here, so a tag moved mid-run cannot mix
      # sources. app-update installs only v<major>.<minor>.<patch>, so any other version
      # would publish a release no installed copy can take.
      - name: Resolve and check the version
        id: version
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 |
            jq -er --arg package "$APP_PACKAGE" '[.packages[] | select(.name == $package)] |
              if length == 1 then .[0].version else error("expected one \($package) package") end')
          if [[ -n "$TAG" ]]; then
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "error: $APP_PACKAGE version $version is not <major>.<minor>.<patch>" >&2
              exit 1
            fi
            if [[ "$TAG" != "v$version" ]]; then
              echo "error: tag $TAG does not match $APP_PACKAGE version v$version" >&2
              exit 1
            fi
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          {
            echo "version=$version"
            echo "tag=$TAG"
            echo "ref=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
      # Prints the CHANGELOG.md section for VERSION, which becomes the release notes, and
      # fails when it is missing or empty, so a release cannot go out without notes. The
      # section runs from its "## <version>" heading to the next "## " heading.
      - &release-notes
        name: Extract the release notes
        run: |
          if [[ -z "$TAG" ]]; then
            echo "dry run: no release notes needed"
            exit 0
          fi
          notes=$(awk -v heading="## $VERSION" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md | sed '/./,$!d')
          if [[ -z "${notes//[[:space:]]/}" ]]; then
            echo "error: CHANGELOG.md has no notes under '## $VERSION'" >&2
            exit 1
          fi
          printf '%s\n' "$notes" | tee "$RUNNER_TEMP/notes.md"

  build-windows:
    name: Build Windows x86_64
    needs: meta
    permissions:
      contents: read
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.meta.outputs.ref }}
          submodules: ${{ inputs.submodules }}
      - *install-rust
      - name: Build the release executable
        run: cargo build --release --locked -p "$APP_PACKAGE"
      - name: Upload the executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-windows-x86_64
          path: target/release/${{ inputs.bin }}.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux x86_64
    if: inputs.linux
    needs: meta
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The release binary needs the glibc it was linked against. Building in 22.04 holds the
    # floor at 2.35; a newer image raises it. Pinned by digest, the same as in ci.yml.
    container: ubuntu:22.04@sha256:829f6df217bcbae2b371026e81711d1a787c61b2967ad09d015063663ebafbf7
    env:
      FLOOR_CHECK: ${{ inputs.linux-floor-check }}
    steps:
      # The same steps as the linux-floor job in ci.yml, which explains them.
      - name: Install build tools
        timeout-minutes: 17
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sed -i -E 's#http://(archive|security)\.ubuntu\.com/ubuntu#http://azure.archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\n' > /etc/apt/apt.conf.d/80-ci
          for attempt in 1 2 3; do
            if timeout 300 apt-get update &&
              timeout 300 apt-get install -y --no-install-recommends git ca-certificates curl build-essential cmake clang libclang-dev; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "apt-get failed or stalled on attempt $attempt; retrying"
            dpkg --configure -a
          done
          git config --global --add safe.directory '*'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.meta.outputs.ref }}
          submodules: ${{ inputs.submodules }}
      - name: Install the pinned Rust toolchain
        env:
          RUSTUP_INIT_URL: https://static.rust-lang.org/rustup/archive/1.29.1/x86_64-unknown-linux-gnu/rustup-init
          RUSTUP_INIT_SHA256: dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$RUNNER_TEMP/rustup-init" "$RUSTUP_INIT_URL"
          echo "$RUSTUP_INIT_SHA256  $RUNNER_TEMP/rustup-init" | sha256sum --check --strict
          chmod 755 "$RUNNER_TEMP/rustup-init"
          "$RUNNER_TEMP/rustup-init" -y --no-modify-path --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install
          # sed reads to the end; head would close the pipe early and pipefail reports SIGPIPE.
          ldd --version | sed -n 1p
          gcc --version | sed -n 1p
          cmake --version | sed -n 1p
          "$HOME/.cargo/bin/rustc" --version
      - name: Build the release executable
        run: cargo build --release --locked -p "$APP_PACKAGE"
      - name: Check glibc floor and linked libraries
        if: inputs.linux-floor-check != ''
        run: '"./$FLOOR_CHECK" "target/release/$BIN"'
      - name: Upload the executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-linux-x86_64
          path: target/release/${{ inputs.bin }}
          if-no-files-found: error

  assemble:
    name: Package and verify
    # build-linux is skipped unless inputs.linux, which must not skip this job too.
    if: ${{ !cancelled() && needs.build-windows.result == 'success' && (needs.build-linux.result == 'success' || needs.build-linux.result == 'skipped') }}
    needs: [meta, build-windows, build-linux]
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      # The README and LICENSE packed into each archive come from the commit that was built.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.meta.outputs.ref }}
      # Merged, so the layout does not depend on how many artifacts match: a pattern that
      # matches one artifact skips the per-artifact folder. <bin>.exe and <bin> never collide.
      - name: Download the executables
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          path: bin
          merge-multiple: true
      # A windows-* platform becomes a .zip and a linux-* platform a .tar.gz. Each archive
      # holds one folder, <bin>-<version>-<platform>/, with the binary, README.md, and LICENSE.
      - name: Package release archives
        run: |
          rm -rf dist
          mkdir -p dist
          read -ra platforms <<< "$PLATFORMS"
          archives=()
          for platform in "${platforms[@]}"; do
            case "$platform" in
              windows-*) executable="$BIN.exe" archive_suffix=zip ;;
              linux-*) executable="$BIN" archive_suffix=tar.gz ;;
              *)
                echo "error: unknown platform $platform" >&2
                exit 2
                ;;
            esac
            binary="bin/$executable"
            if [[ ! -f "$binary" ]]; then
              echo "error: no built executable at $binary" >&2
              exit 2
            fi
            stem="$BIN-$VERSION-$platform"
            mkdir "dist/$stem"
            install -m 755 "$binary" "dist/$stem/$executable"
            install -m 644 README.md LICENSE "dist/$stem/"
            archive="$stem.$archive_suffix"
            if [[ "$archive_suffix" == zip ]]; then
              (cd dist && zip -9 -q -X -r "$archive" "$stem")
            else
              tar -czf "dist/$archive" --sort=name --owner=0 --group=0 --numeric-owner -C dist "$stem"
            fi
            rm -rf "dist/${stem:?}"
            archives+=("$archive")
          done
          (cd dist && sha256sum -- "${archives[@]}" > SHA256SUMS)
      # Checks dist/ holds exactly the archives for PLATFORMS and a SHA256SUMS that matches
      # them, and that each archive holds exactly the expected files.
      - &verify-release
        name: Verify release assets
        run: |
          # Prints a diff and fails when the two newline-separated lists differ.
          same_list() {
            local what=$1 expected=$2 actual=$3
            if [[ "$expected" != "$actual" ]]; then
              echo "error: unexpected $what" >&2
              diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") >&2 || true
              exit 1
            fi
          }
          read -ra platforms <<< "$PLATFORMS"
          archives=()
          for platform in "${platforms[@]}"; do
            stem="$BIN-$VERSION-$platform"
            case "$platform" in
              windows-*)
                executable="$BIN.exe"
                archive="$stem.zip"
                unzip -tq "dist/$archive" > /dev/null
                entries=$(unzip -Z1 "dist/$archive" | sort)
                ;;
              linux-*)
                executable="$BIN"
                archive="$stem.tar.gz"
                entries=$(tar -tzf "dist/$archive" | sort)
                read -r mode _ < <(tar -tvzf "dist/$archive" -- "$stem/$executable")
                if [[ "$mode" != -rwxr-xr-x ]]; then
                  echo "error: $stem/$executable has mode $mode, not -rwxr-xr-x" >&2
                  exit 1
                fi
                ;;
              *)
                echo "error: unknown platform $platform" >&2
                exit 2
                ;;
            esac
            same_list "entries in $archive" \
              "$(printf '%s\n' "$stem/" "$stem/$executable" "$stem/LICENSE" "$stem/README.md" | sort)" \
              "$entries"
            archives+=("$archive")
          done
          same_list "files in dist" \
            "$(printf '%s\n' SHA256SUMS "${archives[@]}" | sort)" \
            "$(find dist -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)"
          hashed=()
          while IFS= read -r line; do
            if [[ ! "$line" =~ ^[0-9a-f]{64}\ \ (.+)$ ]]; then
              echo "error: malformed SHA256SUMS line: $line" >&2
              exit 1
            fi
            hashed+=("${BASH_REMATCH[1]}")
          done < dist/SHA256SUMS
          same_list "files in SHA256SUMS" \
            "$(printf '%s\n' "${archives[@]}" | sort)" \
            "$(printf '%s\n' "${hashed[@]}" | sort)"
          (cd dist && sha256sum --check --strict --quiet SHA256SUMS)
          echo "verified ${archives[*]} and SHA256SUMS"
      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error

  publish:
    name: Attest and publish
    if: ${{ !cancelled() && needs.meta.outputs.tag != '' && needs.assemble.result == 'success' }}
    needs: [meta, assemble]
    permissions:
      attestations: write # Publish provenance for each release asset.
      contents: write # Create the GitHub release and upload assets.
      id-token: write # Request the OIDC identity used for provenance.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TAG: ${{ needs.meta.outputs.tag }}
      VERSION: ${{ needs.meta.outputs.version }}
      REF: ${{ needs.meta.outputs.ref }}
    steps:
      # Only CHANGELOG.md is needed; cone mode with no folders keeps just the top-level files.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.meta.outputs.ref }}
          sparse-checkout: .github
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      # The same check as in assemble, repeated on what was downloaded here.
      - *verify-release
      - *release-notes
      # commits/refs/tags/<tag> names the tag and nothing else; a branch with the tag's name
      # cannot stand in for it.
      - name: Check the tag still names the built commit
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tagged=$(gh api "repos/$GH_REPO/commits/refs/tags/$TAG" --jq .sha)
          if [[ "$tagged" != "$REF" ]]; then
            echo "error: $TAG names $tagged, but this run built $REF" >&2
            exit 1
          fi
      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
