name: Lint

# This repository's own check: the reusable workflows must pass actionlint, which also runs
# shellcheck on every run: block, and zizmor before an app pins them.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint workflows
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same pinned releases as the install step in ci.yml.
      - name: Install actionlint and zizmor
        run: |
          # name sha256 url
          tools=(
            "actionlint 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
            "zizmor e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a https://github.com/zizmorcore/zizmor/releases/download/v1.30.1/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          )
          bin_dir="$RUNNER_TEMP/ci-tools"
          mkdir -p "$bin_dir"
          work=$(mktemp -d)
          for row in "${tools[@]}"; do
            read -r name sha256 url <<< "$row"
            archive="$work/$name.tar.gz"
            curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --retry 3 \
              --output "$archive" "$url"
            echo "$sha256  $archive" | sha256sum --check --strict --quiet
            mapfile -t entries < <(tar -tzf "$archive" | awk -F/ -v name="$name" '$NF == name')
            if ((${#entries[@]} != 1)); then
              echo "error: expected one $name in $url, found ${#entries[@]}" >&2
              exit 1
            fi
            tar -xzf "$archive" -C "$work" -- "${entries[0]}"
            install -m 755 "$work/${entries[0]}" "$bin_dir/$name"
          done
          echo "$bin_dir" >> "$GITHUB_PATH"
      - name: Lint workflows
        run: actionlint
      # The pedantic persona is the one that reports unpinned container images.
      - name: Audit workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --persona pedantic --format github .github/workflows .github/dependabot.yml
